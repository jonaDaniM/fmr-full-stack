[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iso-bom-extractor"
version = "0.7.0"
description = "Reads the bill of materials off piping-isometric drawing PDFs"
requires-python = ">=3.9"
# Pillow is not optional despite nothing importing it directly: openpyxl
# silently drops a workbook's images without it, and the FMR template carries
# seven of them.
dependencies = [
  "PyMuPDF>=1.24,<2",
  "openpyxl>=3.1.5,<3.2",
  "Pillow>=11,<12",
]

[project.optional-dependencies]
# The tests under tests/ need this and nothing declared it, so a fresh
# checkout could install the package and still not run its own suite.
dev = ["pytest>=8,<9"]

[project.scripts]
# What the FMR system calls: drawings in, JSON out.
iso-fmr-json = "iso_bom.fmr_json:main"
# Writes the filled-in FMR workbook. Nothing in the web app uses it — the app
# stops at the rows — but it is what the tests exercise and what a person runs
# to get a spreadsheet out by hand.
iso-fmr-create = "iso_bom.fmr_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

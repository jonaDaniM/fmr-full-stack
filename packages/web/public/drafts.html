<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMR Drafts</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/admin.css">
<style>
  .draft {
    background: var(--card); border: 1px solid var(--rule);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
    display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap;
  }
  .draft.archived { opacity: 0.65; }
  .draft .who { flex: 1; min-width: 220px; }
  .draft .num { font-weight: 700; font-variant-numeric: tabular-nums; }
  .draft .meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .draft .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .draft .acts button {
    font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px;
    border-radius: 7px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--rule); background: var(--ground); color: var(--ink);
  }
  .draft .acts button.ok {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  .draft .acts button:disabled { opacity: 0.4; cursor: not-allowed; }

  .form { background: var(--card); border: 1px solid var(--rule);
          border-radius: 10px; padding: 18px; margin-bottom: 22px; }
  .form h3 { margin: 0 0 14px; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .grid label { display: block; font-size: 12px; font-weight: 700;
                text-transform: uppercase; letter-spacing: 0.05em;
                color: var(--muted); margin-bottom: 5px; }
  .grid input, .grid select, .form textarea {
    width: 100%; font: inherit; padding: 9px 11px;
    border: 1px solid var(--rule); border-radius: 8px;
    background: var(--ground); color: var(--ink);
  }
  .form textarea { margin-top: 12px; font-family: ui-monospace, Menlo, monospace;
                   font-size: 13px; }
  .form .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .form .row button {
    font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px;
    cursor: pointer; border: 1px solid var(--rule);
    background: var(--ground); color: var(--ink);
  }
  .form .row button.ok {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  .issue { font-size: 13px; padding: 7px 12px; border-radius: 7px; margin-bottom: 5px; }
  .issue.error { background: var(--danger-bg); color: var(--danger); }
  .issue.warning { background: var(--warn-bg); color: var(--warn); }
  td[contenteditable]:focus {
    outline: none; background: var(--ok-bg); box-shadow: inset 0 0 0 2px var(--accent);
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">FMR Drafts</span>
  <nav class="tabs">
    <button data-tab="queue" class="on">Queue</button>
    <button data-tab="new">New FMR</button>
  </nav>
  <span class="project"><select id="project" aria-label="Project"></select></span>
</header>
<main id="view"><p class="hint">Loading…</p></main>
<script src="/drafts.js"></script>
</body>
</html>

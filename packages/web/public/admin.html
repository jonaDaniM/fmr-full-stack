<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FMR — Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/fmr.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>

<header class="topbar"></header>

<main class="page">
  <div class="page-head">
    <div>
      <h1>Office</h1>
      <p class="lede">Decide backorders, read the register, see progress by drawing.</p>
    </div>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button type="button" role="tab" data-tab="today" aria-selected="true">Today</button>
    <button type="button" role="tab" data-tab="queue" aria-selected="false">Backorders</button>
    <button type="button" role="tab" data-tab="bags" aria-selected="false">Active bags</button>
    <button type="button" role="tab" data-tab="register" aria-selected="false">Register</button>
    <button type="button" role="tab" data-tab="iso" aria-selected="false">By drawing</button>
  </div>

  <div id="view"></div>
</main>

<script type="module" src="/admin.js"></script>
</body>
</html>

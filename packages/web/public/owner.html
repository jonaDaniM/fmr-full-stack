<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMR Owner</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/admin.css">
<style>
  .check {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--rule);
    border-radius: 10px; margin-bottom: 8px;
  }
  .check .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
  .check.bad .dot { background: var(--warn); }
  .check .name { font-weight: 600; }
  .check .detail { font-size: 13px; color: var(--muted); }
  .check .n { margin-left: auto; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .check.bad .n { color: var(--warn); }

  .lockbar {
    background: var(--card); border: 1px solid var(--rule);
    border-radius: 10px; padding: 16px; margin-bottom: 24px;
  }
  .lockbar.on { background: var(--warn-bg); border-color: var(--warn); }
  .lockbar h3 { margin: 0 0 6px; font-size: 16px; }
  .lockbar p { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
  .lockbar .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lockbar input[type=text] {
    flex: 1; min-width: 220px; font: inherit; padding: 9px 12px;
    border: 1px solid var(--rule); border-radius: 8px;
    background: var(--ground); color: var(--ink);
  }
  .lockbar button {
    font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px;
    cursor: pointer; border: 1px solid var(--rule);
    background: var(--ground); color: var(--ink);
  }
  .lockbar button.danger { background: var(--warn); color: var(--ground); border-color: var(--warn); }

  .diff { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 14px 0; }
  .diff .col { background: var(--ground); border: 1px solid var(--rule); border-radius: 9px; padding: 10px 12px; }
  .diff .col h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
                  letter-spacing: 0.06em; color: var(--muted); }
  .diff .r { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0;
             font-variant-numeric: tabular-nums; }
  .diff .r.changed { font-weight: 700; color: var(--accent); }
  .diff .arrow { color: var(--muted); font-size: 20px; }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">FMR Owner</span>
  <nav class="tabs">
    <button data-tab="health" class="on">Health</button>
    <button data-tab="correct">Corrections</button>
    <button data-tab="notices">Notices</button>
  </nav>
  <span class="project"><select id="project" aria-label="Project"></select></span>
</header>
<main id="view"><p class="hint">Loading…</p></main>
<script src="/owner.js"></script>
</body>
</html>

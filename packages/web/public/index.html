<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FMR — Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/fmr.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body class="density-field">

<header class="topbar"></header>

<form class="searchbar" id="searchForm" role="search">
  <label class="vh" for="q">Search material</label>
  <input id="q" name="q" type="search" autocomplete="off" enterkeyhint="search"
         placeholder="FMR, drawing, or description">
  <button type="submit" class="btn btn-primary" id="searchGo">Search</button>
</form>

<p class="hint" id="hint">Search by FMR number, drawing, or what the material is.</p>

<div class="list" id="results"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
